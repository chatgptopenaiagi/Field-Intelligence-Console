name: Android

on:
  push:
    branches: [v4-development]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'python/src/field_intelligence_console/regional_data/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tooling/android_gate.ps1'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'python/src/field_intelligence_console/regional_data/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tooling/android_gate.ps1'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: Run isolated API 34 x86_64 migration and UI instrumentation (software fallback without KVM)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Official upstream commit identities and action.yml reviewed 2026-10-03.
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up verified JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # reviewed v6 revision, Node 24
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          verify-signature: true
          overwrite-settings: false
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
      - name: Install the declared Android SDK components from the official SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # This SDK manager prints valid --help but returns 1; its install syntax
          # was verified from the actual hosted-runner help before this change.
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Start an explicitly requested isolated emulator
        if: github.event_name == 'workflow_dispatch' && inputs.emulator
        shell: bash
        run: |
          set -euo pipefail
          # Official emulator software fallback; no host permissions/policy changes.
          launcher=()
          accel=on
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            # Use the existing device group only for the runner-owned emulator process.
            group_runner=(sudo -n -u "$(id -un)" -g kvm)
            if [[ -c /dev/kvm ]] && "${group_runner[@]}" test -w /dev/kvm; then
              launcher=("${group_runner[@]}" --preserve-env=ANDROID_HOME,ANDROID_AVD_HOME)
            else
              accel=off
              export ANDROID_I_WANT_MY_TCG=yes
            fi
          fi
          echo "FIC_EMULATOR_ACCELERATION=$accel" >> "$GITHUB_ENV"
          echo "Emulator acceleration: $accel"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$SDKMANAGER" --install 'emulator' 'system-images;android-34;default;x86_64'
          # Reviewed avdmanager help prints valid usage but exits 1; creation is the gate.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fic-owned-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$AVDMANAGER" create avd -n FIC_CI_API34 -p "$ANDROID_AVD_HOME/FIC_CI_API34.avd" -k 'system-images;android-34;default;x86_64'
          test -f "$ANDROID_AVD_HOME/FIC_CI_API34.ini" || { echo 'BLOCKED_RUNTIME: owned AVD metadata not created'; exit 1; }
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/FIC_CI_API34.avd/config.ini"
          printf '\ndisk.dataPartition.size=6G\n' >> "$ANDROID_AVD_HOME/FIC_CI_API34.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -help >/dev/null
          # Official AOSP image saves about 2.52 GiB versus the Google APIs image.
          # Emulator API>=24 still requires a 6 GiB data partition plus headroom.
          available_kib=$(df -Pk "$ANDROID_AVD_HOME" | awk 'NR==2 {print $4}')
          echo "Available AVD storage KiB: $available_kib"
          boot_deadline=$((SECONDS + 900))
          "${launcher[@]}" "$ANDROID_HOME/emulator/emulator" -avd FIC_CI_API34 -port 5580 -accel "$accel" -no-window -no-metrics -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/fic-emulator.log" 2>&1 &
          fic_emulator_pid=$!
          echo "$fic_emulator_pid" > "$RUNNER_TEMP/fic-emulator.pid"
          emulator_diagnostic() {
            python3 -c 'import os,pathlib,re,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text(errors="replace")[-12000:] if p.exists() else "No startup log"; t=re.sub(r"/(?:home|Users|opt|tmp|usr)/[^\s]+", "[runner-path]", t); print("\n".join(t.splitlines()[-35:]))' "$RUNNER_TEMP/fic-emulator.log"
          }
          ready=false
          while (( SECONDS < boot_deadline )); do
            kill -0 "$fic_emulator_pid" 2>/dev/null || { echo 'BLOCKED_RUNTIME: owned emulator exited'; emulator_diagnostic; exit 1; }
            booted="$(timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$booted" == 1 ]]; then ready=true; break; fi
            sleep 2
          done
          "$ready" || { echo 'BLOCKED_RUNTIME: emulator boot timed out'; emulator_diagnostic; exit 1; }
      - name: Execute identical local and CI Android gates
        shell: pwsh
        env:
          FIC_RUN_EMULATOR: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
        run: |
          $options = @{OutputRoot="$env:RUNNER_TEMP/fic-android-gate"}
          if ($env:FIC_RUN_EMULATOR -eq 'true') { $options.DeviceSerial='emulator-5580' }
          ./tooling/android_gate.ps1 @options
      - name: Preserve allowlisted sanitized test and lint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fic-android-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fic-android-gate/gate-receipt.json
            ${{ runner.temp }}/fic-android-gate/run-*/reports/Debug/*.xml
            ${{ runner.temp }}/fic-android-gate/run-*/reports/Release/*.xml
            ${{ runner.temp }}/fic-android-gate/run-*/gradle-gate.log
            ${{ runner.temp }}/fic-android-gate/run-*/instrumentation.log
            ${{ runner.temp }}/fic-android-gate/run-*/emulator-state.log
            ${{ runner.temp }}/fic-android-gate/run-*/install-app-debug.log
            ${{ runner.temp }}/fic-android-gate/run-*/install-app-debug-androidTest.log
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
      - name: Preserve built testing APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fic-android-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Stop only this workflow's emulator
        if: always() && github.event_name == 'workflow_dispatch' && inputs.emulator
        shell: bash
        env:
          FIC_JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$FIC_JOB_STATUS" != success ]]; then
            python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text(errors="replace")[-12000:] if p.exists() else "No emulator log"; t=re.sub(r"/(?:home|Users|opt|tmp|usr)/[^\s]+", "[runner-path]", t); print("\n".join(t.splitlines()[-35:]))' "$RUNNER_TEMP/fic-emulator.log"
          fi
          if [[ -f "$RUNNER_TEMP/fic-emulator.pid" ]]; then
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 emu kill || true
          fi
