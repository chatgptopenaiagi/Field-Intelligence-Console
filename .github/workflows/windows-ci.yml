name: Windows workstation
on:
  workflow_dispatch:
  push:
    branches: [v4-development]
    paths:
      - "windows/**"
      - "python/**"
      - "shared/**"
      - "tooling/windows_gate.ps1"
      - "tooling/python_gate.ps1"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - "python/**"
      - "shared/**"
      - "tooling/windows_gate.ps1"
      - ".github/workflows/windows-ci.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
      - name: Build and exercise actual portable workstation
        shell: pwsh
        run: ./tooling/windows_gate.ps1 -Python python -OutputRoot .local/evidence/windows-ci
      - name: Preserve validated portable binary
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-experimental
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: .local/evidence/windows-ci/artifacts/FieldIntelligenceConsole-4.0.0-beta.6-windows-x64.exe
      - name: Preserve sanitized receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-evidence
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/evidence/windows-ci/gate-summary.json
            .local/evidence/windows-ci/pe-metadata.json
            .local/evidence/windows-ci/packaged-ui.json
            .local/evidence/windows-ci/focused-tests.json
            .local/evidence/windows-ci/native/native-ui.json
            .local/evidence/windows-ci/native/native-restart.json
