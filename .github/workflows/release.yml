name: Experimental release candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated experimental tag for the exact clean candidate
        required: true
        type: string
      publish_draft:
        description: Create PRIVATE draft after every gate; never publish automatically
        required: true
        type: boolean
        default: false
  push:
    tags: ["v*-beta.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  CANDIDATE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
          architecture: x64
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          verify-signature: true
          overwrite-settings: false
      - name: Install only the declared official Android components
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkManager)) { throw 'Official SDK manager unavailable.' }
          # Installed SDK help has been reviewed; some valid --help invocations exit 1.
          # Only the actual install operation below is an installation gate.
          & $sdkManager --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed.' }
      - name: Build actual APK, EXE and wheel with shared clean-candidate gates
        shell: pwsh
        run: ./tooling/release_candidate.ps1 -Stage Build -Tag $env:CANDIDATE_TAG -RequireExistingTag -Python python -OutputRoot .local/ci-release
      - name: Preserve explicit inputs for runtime verification and finalization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fic-candidate-build
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/ci-release/assets/FieldIntelligenceConsole-*-android-debug.apk
            .local/ci-release/assets/FieldIntelligenceConsole-*-windows-x64.exe
            .local/ci-release/assets/FieldIntelligenceConsole-*-source.zip
            .local/ci-release/assets/field_intelligence_console-*-py3-none-any.whl
            .local/ci-release/assets/field_intelligence_console-*.tar.gz
            .local/ci-release/assets/SBOM.cdx.json
            .local/ci-release/assets/THIRD_PARTY_NOTICES.txt
            .local/ci-release/assets/artifact-inventory.json
            .local/ci-release/receipts/android.json
            .local/ci-release/receipts/windows.json
            .local/ci-release/receipts/python.json
            .local/ci-release/receipts/pe-metadata.json
            .local/ci-release/receipts/windows-ui.json
            .local/ci-release/receipts/windows-native.json
            .local/ci-release/receipts/artifact-scan.json
            .local/ci-release/android-test/app-debug-androidTest.apk
            .local/ci-release/build-receipt.json

  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true
          overwrite-settings: false
      # Official v8.0.1 commit and Node24 action inputs reviewed 2026-10-03.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fic-candidate-build
          path: .local/ci-release
          digest-mismatch: error
      - name: Start one isolated emulator without host-policy changes
        shell: bash
        run: |
          set -euo pipefail
          # Official emulator software fallback; no host permissions/policy changes.
          accel=on
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then accel=off; fi
          echo "FIC_EMULATOR_ACCELERATION=$accel" >> "$GITHUB_ENV"
          echo "Emulator acceleration: $accel"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-34;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fic-owned-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$AVDMANAGER" create avd -n FIC_RELEASE_API34 -p "$ANDROID_AVD_HOME/FIC_RELEASE_API34.avd" -k 'system-images;android-34;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/FIC_RELEASE_API34.ini" || { echo 'BLOCKED_RUNTIME: owned AVD metadata not created'; exit 1; }
          boot_deadline=$((SECONDS + 900))
          "$ANDROID_HOME/emulator/emulator" -avd FIC_RELEASE_API34 -port 5580 -accel "$accel" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/fic-release-emulator.local.log" 2>&1 &
          fic_emulator_pid=$!
          echo "$fic_emulator_pid" > "$RUNNER_TEMP/fic-release-emulator.pid"
          emulator_diagnostic() {
            python3 -c 'import os,pathlib,re,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text(errors="replace")[-12000:] if p.exists() else "No startup log"; t=re.sub(r"/(?:home|Users|opt|tmp|usr)/[^\s]+", "[runner-path]", t); print("\n".join(t.splitlines()[-35:]))' "$RUNNER_TEMP/fic-release-emulator.local.log"
          }
          ready=false
          while (( SECONDS < boot_deadline )); do
            kill -0 "$fic_emulator_pid" 2>/dev/null || { echo 'BLOCKED_RUNTIME: owned emulator exited'; emulator_diagnostic; exit 1; }
            booted="$(timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$booted" == 1 ]]; then ready=true; break; fi
            sleep 2
          done
          "$ready" || { echo 'BLOCKED_RUNTIME: emulator boot timed out'; emulator_diagnostic; exit 1; }
      - name: Test the exact built APK and bind runtime evidence to both APK hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content -Raw .local/ci-release/build-receipt.json | ConvertFrom-Json
          $sha = (git rev-parse HEAD).Trim()
          if ($build.source_sha -ne $sha -or $build.tag -ne $env:CANDIDATE_TAG) { throw 'Candidate provenance mismatch.' }
          $apk = ".local/ci-release/assets/FieldIntelligenceConsole-$($build.version)-android-debug.apk"
          $tests = '.local/ci-release/android-test/app-debug-androidTest.apk'
          $apkHash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $testHash = (Get-FileHash $tests -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = @($build.artifacts | Where-Object name -eq ([IO.Path]::GetFileName($apk)))[0]
          if ($apkHash -ne $expected.sha256 -or $testHash -ne $build.instrumentation_apk_sha256) { throw 'Downloaded APK hash mismatch.' }
          $adb = "$env:ANDROID_HOME/platform-tools/adb"
          foreach ($package in @($apk,$tests)) {
            $installed = & $adb -s emulator-5580 install -r $package
            if ($LASTEXITCODE -ne 0 -or "$installed" -notmatch 'Success') { throw 'Non-destructive emulator installation failed.' }
          }
          $result = & timeout 600 $adb -s emulator-5580 shell am instrument -w -e class 'com.fieldconsole.DatabaseMigrationDeviceTest,com.fieldconsole.NetworkUiDeviceTest' com.fieldconsole.debug.test/androidx.test.runner.AndroidJUnitRunner
          $matched = [regex]::Match("$result",'OK \((\d+) tests?\)')
          if ($LASTEXITCODE -ne 0 -or -not $matched.Success -or "$result" -match 'FAILURES|INSTRUMENTATION_FAILED|Process crashed') { throw 'Actual APK instrumentation did not pass.' }
          $count = [int]$matched.Groups[1].Value
          if ($count -lt 6) { throw 'Incomplete runtime test count.' }
          @{status='PASS';source_sha=$sha;tag=$env:CANDIDATE_TAG;tests=$count;apk_sha256=$apkHash;
            instrumentation_apk_sha256=$testHash;runtime='Isolated API34 x86_64 emulator';acceleration=$env:FIC_EMULATOR_ACCELERATION;physical_device='NOT_EXECUTED'} |
            ConvertTo-Json | Set-Content .local/ci-release/android-runtime.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fic-candidate-runtime
          path: .local/ci-release/android-runtime.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Stop only the owned release emulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/fic-release-emulator.pid" ]]; then
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 emu kill || true
          fi

  finalize:
    needs: [build, android-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fic-candidate-build
          path: .local/ci-release
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fic-candidate-runtime
          path: .local/ci-release
          digest-mismatch: error
      - name: Finalize these exact runtime-verified assets
        shell: pwsh
        run: ./tooling/release_candidate.ps1 -Stage Finalize -Tag $env:CANDIDATE_TAG -RequireExistingTag -Python python -OutputRoot .local/ci-release -RuntimeReceipt .local/ci-release/android-runtime.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fic-verified-experimental-assets
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .local/ci-release/assets/FieldIntelligenceConsole-*-android-debug.apk
            .local/ci-release/assets/FieldIntelligenceConsole-*-windows-x64.exe
            .local/ci-release/assets/FieldIntelligenceConsole-*-source.zip
            .local/ci-release/assets/field_intelligence_console-*-py3-none-any.whl
            .local/ci-release/assets/field_intelligence_console-*.tar.gz
            .local/ci-release/assets/SBOM.cdx.json
            .local/ci-release/assets/THIRD_PARTY_NOTICES.txt
            .local/ci-release/assets/artifact-inventory.json
            .local/ci-release/assets/release-manifest.json
            .local/ci-release/assets/SHA256SUMS.txt
            .local/ci-release/assets/RELEASE_NOTES.md

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fic-verified-experimental-assets
          path: candidate
          digest-mismatch: error
      - name: Create only a PRIVATE draft prerelease with explicit verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: chatgptopenaiagi/Field-Intelligence-Console
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || { echo 'Wrong repository'; exit 1; }
          [[ "$(gh repo view "$EXPECTED_REPOSITORY" --json visibility --jq .visibility)" == PRIVATE ]] || { echo 'Repository is not private'; exit 1; }
          cd candidate
          sha256sum --check SHA256SUMS.txt
          python - <<'PY'
          import json, os, pathlib, re
          manifest=json.loads(pathlib.Path("release-manifest.json").read_text())
          tag=os.environ["CANDIDATE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+-[A-Za-z0-9.]+",tag): raise SystemExit("Invalid tag")
          if manifest.get("tag") != tag or manifest.get("visibility") != "private": raise SystemExit("Manifest tag/visibility mismatch")
          if not re.fullmatch(r"[0-9a-f]{40}",manifest.get("source_sha","")): raise SystemExit("Invalid manifest source")
          for name in ("release-manifest.json","SBOM.cdx.json","artifact-inventory.json","THIRD_PARTY_NOTICES.txt","RELEASE_NOTES.md","SHA256SUMS.txt"):
              if not pathlib.Path(name).is_file(): raise SystemExit("Missing verification asset")
          PY
          tag_type="$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.type)"
          [[ "$tag_type" == tag ]] || { echo 'Remote release tag is not annotated'; exit 1; }
          tag_object="$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)"
          tag_commit="$(gh api "repos/$EXPECTED_REPOSITORY/git/tags/$tag_object" --jq .object.sha)"
          manifest_commit="$(python -c 'import json;print(json.load(open("release-manifest.json"))["source_sha"])')"
          [[ "$tag_commit" == "$manifest_commit" ]] || { echo 'Remote tag does not point to tested source'; exit 1; }
          version="$(printf '%s' "$CANDIDATE_TAG" | cut -c2-)"
          assets=("FieldIntelligenceConsole-$version-android-debug.apk"
                  "FieldIntelligenceConsole-$version-windows-x64.exe"
                  "FieldIntelligenceConsole-$version-source.zip"
                  field_intelligence_console-*-py3-none-any.whl
                  field_intelligence_console-*.tar.gz
                  SBOM.cdx.json THIRD_PARTY_NOTICES.txt artifact-inventory.json release-manifest.json SHA256SUMS.txt RELEASE_NOTES.md)
          for asset in "${assets[@]}"; do test -f "$asset"; done
          gh release create "$CANDIDATE_TAG" "${assets[@]}" --repo "$EXPECTED_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "FIC $version experimental" --notes-file RELEASE_NOTES.md
          gh release view "$CANDIDATE_TAG" --repo "$EXPECTED_REPOSITORY" --json url,isDraft,isPrerelease,tagName,assets
          # Coordinator downloads and byte-verifies draft assets before publication.
